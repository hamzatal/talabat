<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>طلبات الموظفين</title>
<meta name="theme-color" content="#14304f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="طلبات الموظفين">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2314304f'/%3E%3Cg transform='translate(64,64) scale(16)' fill='none' stroke='%23C9F73A' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z'/%3E%3Cpath d='M3 6h18M16 10a4 4 0 0 1-8 0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'%3E%3Crect width='512' height='512' rx='112' fill='%2314304f'/%3E%3Cg transform='translate(64,64) scale(16)' fill='none' stroke='%23C9F73A' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'%3E%3Cpath d='M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4z'/%3E%3Cpath d='M3 6h18M16 10a4 4 0 0 1-8 0'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3EFE3;--fg:#17150F;--muted:#6E6755;--line:#D9D1BC;--card:#FAF7EC;
  --lime:#C9F73A;--lime-ink:#151806;--lime-2:#d8fa66;
  --deep:#12100B;--nav-bg:rgba(243,239,227,.92);--hard:#17150F;
  --ink:#14304f;--ink-2:#1e4474;
  --ok:#0f766e;--okbg:#e3f4f1;
  --warn:#b45309;--warnbg:#fdf0e1;
  --wait:#c9a227;--waitbg:#fdf6e3;
  --accent:#3b82f6;--accentbg:#dbeafe;
  --head:'Alexandria',system-ui,sans-serif;--body:'IBM Plex Sans Arabic',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  --ease:cubic-bezier(.22,1,.36,1);--r:14px;--r-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--bg);color:var(--fg);font-size:16px;line-height:1.5;overflow-x:hidden;-webkit-font-smoothing:antialiased;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button{font-family:inherit;cursor:pointer}
input,textarea{font-family:inherit}
:focus-visible{outline:2px solid var(--lime);outline-offset:2px}
::selection{background:var(--lime);color:var(--lime-ink)}
::-webkit-scrollbar{width:8px;height:6px}
::-webkit-scrollbar-track{background:var(--bg)}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.mono{font-family:var(--mono)}
.wrap{max-width:680px;margin:0 auto;padding:0 16px}

/* Header */
header{position:sticky;top:0;z-index:50;background:var(--nav-bg);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);border-bottom:1px solid var(--line);padding:calc(12px + env(safe-area-inset-top)) 16px 12px}
.h-top{display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand{display:flex;align-items:center;gap:8px}
.brand-mark{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;background:var(--lime);color:var(--lime-ink)}
.brand-mark svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.brand-text{font:700 .92rem var(--head);line-height:1.2}
.brand-text small{display:block;font:500 .58rem var(--mono);letter-spacing:.1em;color:var(--muted)}
.date-bar{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:10px}
.date-bar button{width:36px;height:36px;border:1.5px solid var(--line);border-radius:8px;background:transparent;color:var(--fg);display:grid;place-items:center;transition:all .2s}
.date-bar button:hover:not(:disabled){background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.date-bar button:disabled{opacity:.3;cursor:not-allowed}
.date-bar button svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.date-bar .label{font:700 .9rem var(--head);text-align:center;flex:1;color:var(--fg)}

/* Main */
main{padding:14px 0 20px}
.sec-title{font:700 .82rem var(--head);color:var(--fg);margin:18px 0 10px;display:flex;align-items:center;gap:6px;letter-spacing:-.01em}
.sec-title svg{width:15px;height:15px;color:var(--lime-ink);background:var(--lime);padding:2px;border-radius:4px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.sec-title .cnt{margin-inline-start:auto;font:600 .68rem var(--mono);background:var(--card);border:1px solid var(--line);padding:2px 8px;border-radius:99px;color:var(--muted)}
.sec-title:first-child{margin-top:0}

/* Stats */
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;transition:transform .2s}
.stat small{color:var(--muted);display:block;font-size:11px;font-weight:500;margin-bottom:2px}
.stat b{font:800 1.3rem/1.1 var(--head);letter-spacing:-.02em;display:flex;align-items:baseline;gap:2px}
.stat b small{font-size:11px;font-weight:600;color:var(--muted);display:inline;margin:0}
.stat.big{background:var(--lime);color:var(--lime-ink);border-color:var(--lime-ink)}
.stat.big small{color:rgba(21,24,6,.6)}
.stat.big b small{color:rgba(21,24,6,.5)}

/* Progress */
.prog{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:12px}
.prog-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
.prog-h b{font:700 .78rem var(--head);display:flex;align-items:center;gap:4px}
.prog-h b svg{width:14px;height:14px;color:var(--lime-ink);background:var(--lime);padding:1px;border-radius:3px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.prog-h span{font:600 .72rem var(--mono);color:var(--muted)}
.prog-track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.prog-fill{height:100%;background:linear-gradient(90deg,var(--lime),#a0d020);border-radius:99px;transition:width .5s var(--ease);position:relative}
.prog-fill::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.3),transparent);animation:shimmer 2s linear infinite}
@keyframes shimmer{to{transform:translateX(200%)}}
.prog-fill.full{background:linear-gradient(90deg,#10b981,var(--lime))}

/* Card */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;position:relative;overflow:hidden;transition:transform .2s var(--ease),box-shadow .2s;border-inline-start:4px solid var(--line);animation:cIn .25s ease}
@keyframes cIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--lime)}
.card.wait{border-inline-start-color:var(--wait)}
.card.purch{border-inline-start-color:var(--accent)}
.card.priced{border-inline-start-color:var(--ok)}
.card.settled{border-inline-start-color:var(--muted);opacity:.55}
.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:5px}
.card-name{font:800 .95rem var(--head);display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.card-name .qty{font:700 .65rem var(--mono);background:var(--lime);color:var(--lime-ink);padding:1px 6px;border-radius:99px}
.paid-badge{font:700 .68rem var(--mono);background:var(--bg);border:1px solid var(--line);padding:3px 8px;border-radius:99px;color:var(--muted);white-space:nowrap}
.card-text{font-size:.85rem;line-height:1.55;color:var(--fg);margin-bottom:8px;word-break:break-word;opacity:.85}
.status-row{background:var(--bg);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px;display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}
.tag{font:700 .68rem var(--body);padding:3px 9px;border-radius:99px;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.tag svg{width:11px;height:11px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.tag.wait{background:var(--waitbg);color:var(--wait)}
.tag.purch{background:var(--accentbg);color:var(--accent)}
.tag.pos{background:var(--okbg);color:var(--ok)}
.tag.neg{background:var(--warnbg);color:var(--warn)}
.tag.zero{background:var(--line);color:var(--muted)}
.tag.done{background:var(--lime);color:var(--lime-ink)}

/* زر تم الشراء — بارز وواضح */
.btn-purch-full{width:100%;padding:11px;background:var(--lime);color:var(--lime-ink);border:1.5px solid var(--lime-ink);border-radius:var(--r-sm);font:800 .9rem var(--head);display:flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;box-shadow:2px 2px 0 var(--hard);transition:all .15s}
.btn-purch-full svg{width:17px;height:17px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.btn-purch-full:hover{transform:translate(1px,1px);box-shadow:1px 1px 0 var(--hard)}
.btn-purch-full:active{transform:translate(2px,2px);box-shadow:none}

.mini{font:700 .72rem var(--body);border:1.5px solid var(--line);border-radius:8px;padding:5px 10px;background:transparent;color:var(--fg);transition:all .15s;display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.mini svg{width:13px;height:13px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.mini:hover{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.mini.solid{background:var(--lime);color:var(--lime-ink);border-color:var(--lime-ink)}
.mini.solid:hover{background:var(--lime-2)}
.mini.ok{background:var(--ok);color:#fff;border-color:var(--ok)}
.mini.ok:hover{opacity:.85}
.mini.ghost{border-color:var(--line)}
.price-inline{display:flex;gap:4px;align-items:center}
.price-inline input{width:80px;border:1.5px solid var(--line);border-radius:8px;padding:5px 8px;font:600 .8rem var(--mono);background:var(--card);color:var(--fg);text-align:center}
.price-inline input:focus{outline:none;border-color:var(--lime)}
.card-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-top:8px;padding-top:7px;border-top:1px dashed var(--line)}
.foot-time{font:500 .62rem var(--mono);color:var(--muted);display:flex;align-items:center;gap:3px}
.foot-time svg{width:11px;height:11px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.foot-actions{display:flex;gap:2px}
.link-btn{background:none;border:0;color:var(--muted);font:700 .68rem var(--body);padding:4px 7px;border-radius:6px;transition:all .15s;display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.link-btn svg{width:12px;height:12px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.link-btn:hover{background:var(--line);color:var(--fg)}
.link-btn.danger:hover{background:var(--warnbg);color:var(--warn)}

/* Empty */
.empty{text-align:center;padding:40px 20px;border:1.5px dashed var(--line);border-radius:var(--r);background:var(--card)}
.empty-ic{width:64px;height:64px;border-radius:50%;background:var(--bg);display:grid;place-items:center;margin:0 auto 12px;color:var(--muted)}
.empty-ic svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.empty b{display:block;font:800 1rem var(--head);color:var(--fg);margin-bottom:4px}
.empty p{color:var(--muted);font-size:.82rem;max-width:240px;margin:0 auto;line-height:1.6}

/* Note */
.note{font-size:.78rem;color:var(--muted);margin:8px 0 12px;display:flex;align-items:flex-start;gap:5px;line-height:1.6;padding:8px 10px;background:var(--card);border:1px solid var(--line);border-radius:8px}
.note svg{width:14px;height:14px;flex-shrink:0;margin-top:1px;color:var(--lime-ink);background:var(--lime);padding:1px;border-radius:3px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* Shopping view */
.shop-hero{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;text-align:center}
.shop-hero h2{font:800 1.1rem var(--head);margin-bottom:4px;display:flex;align-items:center;justify-content:center;gap:6px}
.shop-hero h2 svg{width:20px;height:20px;color:var(--lime-ink);background:var(--lime);padding:3px;border-radius:5px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.shop-hero p{color:var(--muted);font-size:.78rem}
.shop-emp{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.shop-emp-h{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--bg)}
.shop-emp-h b{font:800 .88rem var(--head)}
.shop-emp-h .cnt{font:600 .66rem var(--mono);color:var(--muted);margin-inline-start:6px}
.shop-item{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer;transition:background .15s}
.shop-item:last-child{border-bottom:none}
.shop-item:hover{background:var(--bg)}
.shop-item:active{background:var(--lime);color:var(--lime-ink)}
.shop-item-info{flex:1;min-width:0}
.shop-item-info b{font:700 .82rem var(--head);display:block;word-break:break-word}
.shop-item-info small{font:600 .66rem var(--mono);color:var(--muted)}
.shop-check{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;flex-shrink:0;transition:all .2s;color:var(--muted)}
.shop-item:hover .shop-check{border-color:var(--lime);background:var(--lime);color:var(--lime-ink)}
.shop-check svg{width:16px;height:16px;stroke-width:3;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* Balance */
.bal-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;transition:transform .2s,box-shadow .2s}
.bal-card:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--lime)}
.bal-info b{font:800 .88rem var(--head);display:block}
.bal-info small{font-size:.66rem;color:var(--muted)}
.bal-r{text-align:end;display:flex;flex-direction:column;align-items:flex-end;gap:5px}

/* History */
.hist{width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .15s}
.hist:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--lime);border-color:var(--lime)}
.hist-l b{font:800 .83rem var(--head);display:block}
.hist-l small{font-size:.66rem;color:var(--muted)}
.hist-r{font:800 .83rem var(--mono);color:var(--fg);text-align:end}
.hist-r small{display:block;color:var(--muted);font-size:.66rem;font-weight:500}
.hist.danger:hover{box-shadow:4px 4px 0 var(--warn);border-color:var(--warn)}

/* Settings */
.set-row{width:100%;text-align:start;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;margin-bottom:7px;display:flex;justify-content:space-between;align-items:center;gap:10px;cursor:pointer;transition:all .15s}
.set-row:hover{transform:translate(-2px,-2px);box-shadow:4px 4px 0 var(--lime);border-color:var(--lime)}
.set-row.danger:hover{box-shadow:4px 4px 0 var(--warn);border-color:var(--warn)}
.set-row.info{cursor:default}
.set-row.info:hover{transform:none;box-shadow:none;border-color:var(--line)}
.set-l{display:flex;align-items:center;gap:8px}
.set-ic{width:32px;height:32px;border-radius:8px;background:var(--bg);display:grid;place-items:center;color:var(--ink);border:1px solid var(--line);flex-shrink:0}
.set-ic svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.set-ic.danger{color:var(--warn);background:var(--warnbg);border-color:var(--warnbg)}
.set-l b{font:800 .83rem var(--head);display:block}
.set-l small{font-size:.66rem;color:var(--muted)}

/* Tab bar */
#tabbar{position:fixed;bottom:0;inset-inline:0;z-index:60;display:grid;grid-template-columns:repeat(5,1fr);background:var(--nav-bg);backdrop-filter:blur(20px) saturate(1.5);-webkit-backdrop-filter:blur(20px) saturate(1.5);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 0 2px;color:var(--muted);font:600 .62rem var(--body);position:relative;background:none;border:0;cursor:pointer;transition:color .2s}
.tab .ti{width:44px;height:28px;border-radius:99px;display:grid;place-items:center;transition:all .25s var(--ease)}
.tab .ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tab.on{color:var(--fg)}
.tab.on .ti{background:var(--lime);color:var(--lime-ink)}
.tab:active .ti{transform:scale(.9)}
.tab-fab{justify-content:flex-end}
.tab-fab .fab{width:52px;height:52px;margin-top:-26px;border-radius:50%;background:var(--lime);color:var(--lime-ink);border:2px solid var(--lime-ink);display:grid;place-items:center;box-shadow:0 4px 0 var(--hard),0 8px 20px -4px rgba(201,247,58,.5);transition:all .2s}
.tab-fab .fab .ic{width:24px;height:24px;stroke-width:2.5}
.tab-fab:active .fab{transform:translateY(2px) scale(.95);box-shadow:0 2px 0 var(--hard)}
.tab-fab .tl,.tab-fab.on .tl{color:var(--fg)}

/* Sheet */
.ov{position:fixed;inset:0;background:rgba(8,7,4,.5);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);display:none;align-items:flex-end;z-index:100;animation:fade .2s ease}
.ov.open{display:flex}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sheet{background:var(--card);width:100%;max-width:680px;margin:0 auto;border-radius:24px 24px 0 0;padding:8px 18px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto;animation:sUp .3s var(--ease)}
@keyframes sUp{from{transform:translateY(100%)}to{transform:none}}
.sheet-h{display:flex;justify-content:space-between;align-items:center;padding:12px 0 10px;position:sticky;top:0;background:var(--card);z-index:1;border-bottom:1px solid var(--line);margin-bottom:4px}
.sheet-h h3{font:800 1rem var(--head);display:flex;align-items:center;gap:6px}
.sheet-h h3 .ic{width:18px;height:18px;color:var(--lime-ink);background:var(--lime);padding:2px;border-radius:4px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.sheet-x{width:32px;height:32px;border:0;border-radius:50%;background:var(--line);color:var(--fg);display:grid;place-items:center;font-size:16px;transition:all .15s}
.sheet-x:hover{background:var(--warn);color:#fff}
label{display:block;font:700 .76rem var(--head);margin:10px 0 4px;color:var(--fg)}
label .hint{font-weight:500;font-size:.66rem;color:var(--muted);margin-inline-start:4px}
input,textarea{width:100%;border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;background:var(--bg);color:var(--fg);font-size:.88rem;transition:all .15s}
input:focus,textarea:focus{outline:none;border-color:var(--lime);box-shadow:0 0 0 3px rgba(201,247,58,.15)}
textarea{resize:vertical;min-height:50px}
.row-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{font:700 .85rem var(--head);border:0;border-radius:var(--r-sm);padding:11px 14px;background:var(--lime);color:var(--lime-ink);transition:all .15s;display:inline-flex;align-items:center;justify-content:center;gap:5px;cursor:pointer}
.btn .ic{width:16px;height:16px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.btn:hover{background:var(--lime-2)}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--fg)}
.btn.ghost:hover{background:var(--line)}
.chips{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap}
.chips button{border:1.5px solid var(--line);background:transparent;border-radius:99px;padding:5px 11px;font:700 .72rem var(--body);color:var(--fg);transition:all .15s;cursor:pointer}
.chips button:hover{background:var(--lime);color:var(--lime-ink);border-color:var(--lime)}
.check-row{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;background:var(--bg);border:1.5px solid var(--line);border-radius:var(--r-sm);cursor:pointer;transition:border-color .15s}
.check-row:hover{border-color:var(--lime)}
.check-row input{width:20px;height:20px;accent-color:var(--lime);cursor:pointer}
.check-row label{margin:0;font-size:.76rem;cursor:pointer;font-weight:700;color:var(--fg)}
.check-row label small{display:block;font-weight:500;color:var(--muted);font-size:.66rem;margin-top:1px}

/* Toast */
.toast{position:fixed;bottom:calc(90px + env(safe-area-inset-bottom));inset-inline:0;margin:auto;width:max-content;max-width:90%;background:var(--deep);color:#F1EDDF;border:1px solid var(--lime);padding:9px 16px;border-radius:99px;font:700 .78rem var(--body);opacity:0;pointer-events:none;transform:translateY(8px);transition:all .25s;z-index:200;display:flex;align-items:center;gap:5px;box-shadow:0 8px 24px -4px rgba(0,0,0,.3)}
.toast.show{opacity:1;transform:none}
.toast svg{color:var(--lime);width:15px;height:15px;stroke-width:2.5;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}

/* Confirm */
.confirm{position:fixed;inset:0;z-index:300;background:rgba(8,7,4,.5);backdrop-filter:blur(6px);display:none;place-items:center;padding:20px;animation:fade .2s}
.confirm.open{display:grid}
.confirm-box{background:var(--card);border:1.5px solid var(--line);border-radius:var(--r);padding:18px;max-width:360px;width:100%;box-shadow:6px 6px 0 var(--lime);animation:cIn .25s ease}
.confirm-box h3{font:800 1rem var(--head);margin-bottom:6px;display:flex;align-items:center;gap:6px}
.confirm-box h3 svg{color:var(--warn);width:18px;height:18px;stroke-width:2;fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.confirm-box p{color:var(--muted);font-size:.85rem;margin-bottom:14px;line-height:1.6}
.confirm-acts{display:flex;gap:8px}
.confirm-acts .btn{flex:1}

@media (max-width:560px){.stats{grid-template-columns:1fr 1fr}.row-2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
